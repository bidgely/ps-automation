# Template only — DO NOT fill this in with real values and commit it to git.
# A Kubernetes Secret's values are base64-ENCODED, not encrypted, so a filled-in
# copy of this file is just as sensitive as your .env file.
#
# Preferred ways to actually create this:
#
#   1. Straight from your existing .env (recommended, nothing to fill in below):
#        kubectl create secret generic opshub-secrets --from-env-file=.env
#
#   2. Generate this exact YAML from .env without applying it, if you want to
#      inspect it or hand it to a GitOps tool that encrypts it before storing
#      (e.g. Sealed Secrets, SOPS, External Secrets Operator):
#        kubectl create secret generic opshub-secrets \
#          --from-env-file=.env --dry-run=client -o yaml > secret.generated.yaml
#      Only commit the SEALED/ENCRYPTED output of tools like Sealed Secrets —
#      never the plain output of the command above.
#
# The manifest shape it produces looks like this (values shown here are placeholders):

apiVersion: v1
kind: Secret
metadata:
  name: opshub-secrets
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  FLASK_SECRET_KEY: "REPLACE_ME"
